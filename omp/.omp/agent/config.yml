modelRoles: 
  default: openai-codex/gpt-5.6-luna:high
symbolPreset: nerd
theme: 
  dark: dark-tokyo-night
setupVersion: 2
defaultThinkingLevel: auto
tools: 
  approvalMode: always-ask
  approval: 
    web_search: allow
statusLine: 
  preset: custom
  separator: none
  transparent: true
  showHookStatus: true
  compactThinkingLevel: false
  leftSegments: 
    - model
    - mode
    - path
    - git
  rightSegments: 
    - session_name
    - token_total
    - context_pct
    - cost
hideThinkingBlock: true
startup: 
  quiet: true
vault: 
  enabled: true
composer: 
  shape: rail